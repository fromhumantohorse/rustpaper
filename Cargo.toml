[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/fromhumantohorse/rustpaper"

[workspace.dependencies]
rustpaper-domain = { path = "crates/domain" }
rustpaper-application = { path = "crates/application" }
rustpaper-infrastructure = { path = "crates/infrastructure" }
rustpaper-i18n = { path = "crates/i18n" }
ar-reshaper = "1.5"
unicode-bidi = "0.3"
sys-locale = "0.3"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
directories = "5"
fastrand = "2"
libmpv2 = "4"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui-phosphor = "0.7.3"
raw-window-handle = "0.6"
rfd = "0.15"
getrandom = "0.4"
png = "0.18"
tray-icon = "0.26"
embed-resource = "3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
x11rb = { version = "0.13", features = ["randr"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
